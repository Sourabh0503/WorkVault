name: CI

# Run on every push to master and on every pull request targeting master.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# If you push twice quickly (or push to an open PR), cancel the older run
# still in progress so we don't waste runners on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Backend: build the solution and run the integration tests.
  # The tests use Testcontainers, which starts a real PostgreSQL
  # container via Docker. GitHub-hosted ubuntu runners ship with
  # Docker already running, so no extra service setup is needed.
  # ----------------------------------------------------------------
  server:
    name: Server build & integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Restore/build/test are split into separate steps so that if one
      # fails, the log points straight at the stage that broke.
      - name: Restore
        run: dotnet restore WorkVault.sln

      - name: Build
        run: dotnet build WorkVault.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WorkVault.sln --configuration Release --no-build --verbosity normal

  # ----------------------------------------------------------------
  # Frontend: install dependencies and produce a production build.
  # This catches TypeScript / template errors before they reach main.
  # ----------------------------------------------------------------
  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/package-lock.json

      # 'npm ci' is the CI-friendly install: it installs exactly what's in
      # package-lock.json and fails if the lockfile is out of sync.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ----------------------------------------------------------------
  # Verify the production Docker image still builds. This is a smoke
  # test for deployability — if the Dockerfile breaks, we find out in
  # CI instead of at deploy time. The image is built but not pushed.
  # ----------------------------------------------------------------
  docker:
    name: Docker image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: Server
          file: Server/Dockerfile
          push: false
          # Cache layers in the GitHub Actions cache so repeat builds are fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # Continuous Deployment — test-gated. Triggers Render to deploy the
  # API and client, but only after server/client/docker all pass, and
  # only on a direct push to master (i.e. after a PR merges). Render's
  # own auto-deploy is off (render.yaml), so this is the single path to
  # production. Add the two deploy-hook URLs from the Render dashboard as
  # repo secrets; until then the job skips gracefully instead of failing.
  # ----------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [server, client, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render deploys
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          CLIENT_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}
        run: |
          if [ -z "$API_HOOK" ] || [ -z "$CLIENT_HOOK" ]; then
            echo "Deploy hooks not configured — skipping deploy."
            echo "Add RENDER_DEPLOY_HOOK_API and RENDER_DEPLOY_HOOK_CLIENT secrets to enable."
            exit 0
          fi
          echo "Triggering API deploy..."
          curl -fsS -X POST "$API_HOOK"
          echo "Triggering client deploy..."
          curl -fsS -X POST "$CLIENT_HOOK"
