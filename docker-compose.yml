# Local development infrastructure for WorkVault.
# Brings up Postgres, RabbitMQ and pgAdmin with the same ports/credentials the
# app expects in appsettings.Development.json.
#
#   docker compose up -d       # start everything (detached)
#   docker compose down        # stop (keeps data volumes)
#   docker compose down -v      # stop AND wipe data (fresh DB/broker)
#
# UIs:  RabbitMQ → http://localhost:15672 (guest/guest)
#       pgAdmin  → http://localhost:5050  (admin@workvault.com / admin123)
name: workvault

services:
  postgres:
    image: postgres:16
    container_name: workvault-db
    environment:
      POSTGRES_USER: workvault
      POSTGRES_PASSWORD: workvault123
      POSTGRES_DB: workvaultdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workvault -d workvaultdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: workvault-rabbitmq
    ports:
      - "5672:5672"    # AMQP  (amqp://guest:guest@localhost:5672/)
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: workvault-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@workvault.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:
  pgadmin_data:
