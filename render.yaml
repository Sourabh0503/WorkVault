# Render Blueprint — infrastructure as code for WorkVault.
# Matches the live deployment (Render Project "workVault", Production env).
# Auto-deploy is OFF (autoDeployTrigger: off): deploys are triggered by the
# GitHub Actions "deploy" job via Render deploy hooks, and only AFTER the CI
# build/test/docker jobs pass — see .github/workflows/ci.yml.
# Docs: https://render.com/docs/blueprint-spec
#
# Live URLs:
#   API    → https://workvault-api.onrender.com   (service "WorkVault-Api")
#   Client → https://workvault.onrender.com        (service "WorkVault")
#
# NOTE on names: the static site is named "WorkVault", so its host is
# workvault.onrender.com (NOT workvault-client). The API's CORS/FrontendUrl
# and Client/src/environments/environment.prod.ts must stay consistent with
# these hosts.

version: "1"

projects:
  - name: workVault
    environments:
      - name: Production
        services:
          # -----------------------------------------------------------
          # .NET API — built from Server/Dockerfile.
          # -----------------------------------------------------------
          - type: web
            name: WorkVault-Api
            runtime: docker
            repo: https://github.com/Sourabh0503/WorkVault
            plan: free
            region: singapore
            rootDir: Server
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: "off"
            healthCheckPath: /health
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              # Injected from the managed database below.
              - key: ConnectionStrings__DefaultConnection
                fromDatabase:
                  name: workvault-db
                  property: connectionString
              # Strong random value generated once and kept stable.
              - key: JwtSettings__SecretKey
                generateValue: true
              - key: JwtSettings__Issuer
                value: WorkVault
              - key: JwtSettings__Audience
                value: WorkVault
              - key: JwtSettings__AccessTokenExpirationMinutes
                value: "15"
              - key: JwtSettings__RefreshTokenExpirationDays
                value: "7"
              # Full scheme+host of the client; CORS matches Origin exactly.
              - key: AppSettings__FrontendUrl
                value: https://workvault.onrender.com
              - key: CorsSettings__AllowedOrigins__0
                value: https://workvault.onrender.com

          # -----------------------------------------------------------
          # Angular client — static site. rootDir is Client, so paths
          # below are relative to it (dist/Client/browser).
          # -----------------------------------------------------------
          - type: web
            name: WorkVault
            runtime: static
            repo: https://github.com/Sourabh0503/WorkVault
            rootDir: Client
            buildCommand: npm install && npm run build -- --configuration production
            staticPublishPath: dist/Client/browser
            autoDeployTrigger: "off"
            # SPA fallback so deep links like /employees don't 404 on refresh.
            routes:
              - type: rewrite
                source: /*
                destination: /index.html

        databases:
          - name: workvault-db
            databaseName: workvault
            user: workvault
            plan: free
            region: singapore
            postgresMajorVersion: "18"
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere
