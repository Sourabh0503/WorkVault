# Render Blueprint — infrastructure as code for WorkVault.
# Matches the live deployment (Render Project "workVault", Production env).
# Auto-deploy is OFF (autoDeployTrigger: off): deploys are triggered by the
# GitHub Actions "deploy" job via Render deploy hooks, and only AFTER the CI
# build/test/docker jobs pass — see .github/workflows/ci.yml.
# Docs: https://render.com/docs/blueprint-spec
#
# Live URLs (custom domain on GoDaddy, mapped onto these Render services):
#   App → https://workvault.co.in       (Render service "WorkVault"     → workvault.onrender.com)
#   API → https://api.workvault.co.in   (Render service "WorkVault-Api"  → workvault-api.onrender.com)
#
# NOTE: AppSettings__FrontendUrl and CorsSettings__AllowedOrigins below must match the
# public origin the browser actually uses (workvault.co.in) and stay consistent with
# Client/src/environments/environment.prod.ts (which calls https://api.workvault.co.in/api).
# CORS allows the apex + www custom-domain origins; the *.onrender.com origin is disabled.

version: "1"

projects:
  - name: workVault
    environments:
      - name: Production
        services:
          # -----------------------------------------------------------
          # .NET API — built from Server/Dockerfile.
          # -----------------------------------------------------------
          - type: web
            name: WorkVault-Api
            runtime: docker
            repo: https://github.com/Sourabh0503/WorkVault
            plan: free
            region: singapore
            rootDir: Server
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: "off"
            healthCheckPath: /health
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              # External Postgres (not Render-managed). Set the full connection
              # string as a secret in the Render dashboard — not committed.
              - key: ConnectionStrings__DefaultConnection
                sync: false
              # Strong random value generated once and kept stable.
              - key: JwtSettings__SecretKey
                generateValue: true
              - key: JwtSettings__Issuer
                value: WorkVault
              - key: JwtSettings__Audience
                value: WorkVault
              - key: JwtSettings__AccessTokenExpirationMinutes
                value: "15"
              - key: JwtSettings__RefreshTokenExpirationDays
                value: "7"
              # Full scheme+host of the client; used to build email links and matched
              # by CORS. Apex + www of the GoDaddy custom domain are allowed.
              - key: AppSettings__FrontendUrl
                value: https://workvault.co.in
              - key: CorsSettings__AllowedOrigins__0
                value: https://workvault.co.in
              - key: CorsSettings__AllowedOrigins__1
                value: https://www.workvault.co.in

              # Async email — RabbitMQ (CloudAMQP) publisher + Brevo SMTP consumer.
              # Secrets (broker URI, SMTP creds) are set in the Render dashboard, not committed.
              - key: RabbitMQ__ConnectionString
                sync: false
              - key: EmailSettings__SmtpHost
                value: smtp-relay.brevo.com
              - key: EmailSettings__SmtpPort
                value: "587"
              - key: EmailSettings__SmtpUser
                sync: false
              - key: EmailSettings__SmtpKey
                sync: false
              # Brevo HTTP API key (xkeysib-…) — the sender now calls the Brevo REST API
              # over HTTPS (443) instead of SMTP, since Render's free plan blocks outbound
              # SMTP ports. Set the value as a secret in the Render dashboard.
              - key: EmailSettings__ApiKey
                sync: false
              - key: EmailSettings__FromEmail
                value: no-reply@workvault.co.in
              - key: EmailSettings__FromName
                value: WorkVault

          # -----------------------------------------------------------
          # Angular client — static site. rootDir is Client, so paths
          # below are relative to it (dist/Client/browser).
          # -----------------------------------------------------------
          - type: web
            name: WorkVault
            runtime: static
            repo: https://github.com/Sourabh0503/WorkVault
            rootDir: Client
            buildCommand: npm install && npm run build -- --configuration production
            staticPublishPath: dist/Client/browser
            autoDeployTrigger: "off"
            # SPA fallback so deep links like /employees don't 404 on refresh.
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
