<div class="auth-shell">
  <!-- Left brand panel -->
  <aside class="brand-panel">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <a routerLink="/" class="logo-link">
      <app-logo variant="full" inverse [height]="44" />
    </a>

    <div class="brand-content">
      <div class="kicker">{{ copy().kicker }}</div>
      <h2>{{ copy().heading }}</h2>
      <p class="brand-sub">{{ copy().sub }}</p>
    </div>

    <div class="brand-tags">
      <span>MULTI-TENANT</span>
      <span>BCRYPT · JWT</span>
      <span>DPDP-READY</span>
    </div>
  </aside>

  <!-- Right form column -->
  <main class="form-column">
    <!-- Shown only on small screens, where the brand panel is hidden -->
    <a routerLink="/" class="mobile-logo">
      <app-logo variant="full" tagline [height]="40" />
    </a>

    <router-outlet />
  </main>
</div>
