<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52">
  <!-- Adapts to the browser / OS colour scheme.
       Light scheme: emerald mark. Dark scheme: brighter emerald so it stays
       legible against dark tab strips. -->
  <style>
    .bg     { fill: #059669; }
    .detail { fill: #FFFFFF; stroke: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #10B981; }
      .detail { fill: #ECFDF5; stroke: #ECFDF5; }
    }
  </style>
  <rect class="bg" x="2" y="2" width="48" height="48" rx="13"></rect>
  <rect class="detail" x="13" y="13" width="26" height="26" rx="6" fill="none" stroke-width="3.5"></rect>
  <rect class="detail" x="21" y="21" width="18" height="18" rx="4.5" stroke="none"></rect>
</svg>
